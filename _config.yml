# GitHub Pages build rules.
#
# product-source/ is local-only, git-ignored and must NEVER be published.
# `exclude` is the second belt (the first is that it is never committed).
exclude:
  - product-source
  - _dev   # build helpers and old docs; the _ prefix already hides them
  # Arabic is deferred to its own later round: 18 of 90 pages exist, so
  # serving them now would publish a half-finished translation. The files
  # stay in the repository untouched; deleting this line publishes them again.
  - ar
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - node_modules
  - README.md
  - LICENSE

# No theme, no plugins: the site is plain static HTML/CSS/JS.
theme: null
