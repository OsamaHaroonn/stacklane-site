# GitHub Pages build rules.
#
# product-source/ is local-only, git-ignored and must NEVER be published.
# `exclude` is the second belt (the first is that it is never committed).
exclude:
  - product-source
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - node_modules
  - README.md
  - LICENSE

# No theme, no plugins: the site is plain static HTML/CSS/JS.
theme: null
